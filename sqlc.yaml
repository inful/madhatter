version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/database/sqlc/queries/*.sql"
    schema: "internal/database/sqlc/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/sqlc"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "text"
            go_type: "string"
          - db_type: "date"
            go_type: "string"
          - db_type: "datetime"
            go_type: "time.Time"
          - db_type: "integer"
            go_type: "int64"
        rename:
          id: "ID"
          created_at: "CreatedAt"
          member_id: "MemberID"
          start_date: "StartDate"
          end_date: "EndDate"
          cover_member_id: "CoverMemberID"
          original_assignment_id: "OriginalAssignmentID"
          is_active: "IsActive"
          is_cover: "IsCover"